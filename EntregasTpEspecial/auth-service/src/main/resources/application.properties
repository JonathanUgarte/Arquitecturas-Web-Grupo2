spring.application.name=auth-service
server.port=8083

# Base de datos H2 en archivo para ejecucion local. En Docker se reemplaza por PostgreSQL
# con las variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:h2:file:./data/auth;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# JWT: el mismo secreto lo usa el gateway para validar los tokens (minimo 32 caracteres).
# En Docker se define con la variable JWT_SECRET.
jwt.secret=${JWT_SECRET:ticketya-secreto-de-desarrollo-cambiar-en-produccion-2026}
jwt.expiracion-minutos=60

management.endpoints.web.exposure.include=health
