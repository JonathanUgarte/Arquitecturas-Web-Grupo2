spring.application.name=preferencias-service
server.port=8084

# MongoDB (configuracion de la catedra: usuario root / password). Base propia: "preferencias".
# Para ejecucion local: docker compose up mongo rabbitmq. En Docker se define con SPRING_DATA_MONGODB_URI.
spring.data.mongodb.uri=mongodb://root:password@localhost:27017/preferencias?authSource=admin
spring.data.mongodb.auto-index-creation=true

# RabbitMQ: en Docker el host se define con SPRING_RABBITMQ_HOST=rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=ticketya
spring.rabbitmq.password=ticketya
# Si procesar un mensaje falla: 3 intentos y despues va a la cola de fallidos (no se reencola para siempre)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Servicio de catalogo (eventos a la venta y detalle de un evento)
preferencias.catalogo-url=http://localhost:8081

management.endpoints.web.exposure.include=health

# Cada linea de log lleva el id de correlacion del pedido: [servicio,correlationId]
logging.pattern.correlation=[${spring.application.name},%X{correlationId:-}] 
logging.include-application-name=false
