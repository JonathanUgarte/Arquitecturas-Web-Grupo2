# Base en memoria para los tests (no toca la base de archivo)
spring.datasource.url=jdbc:h2:mem:ventas_test;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
ventas.reserva-minutos=10
ventas.max-entradas-por-evento=4
# los tests no necesitan RabbitMQ: los eventos se verifican dentro de la aplicacion
ticketya.mensajeria.habilitada=false
ticketya.turno.secreto=secreto-de-turnos-para-los-tests-de-al-menos-32-caracteres
# reintentos rapidos y circuit breaker chico para poder probarlos
resilience4j.retry.instances.catalogo.wait-duration=10ms
resilience4j.retry.instances.pasarela.wait-duration=10ms
resilience4j.circuitbreaker.instances.catalogo.sliding-window-size=4
resilience4j.circuitbreaker.instances.catalogo.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.pasarela.sliding-window-size=4
resilience4j.circuitbreaker.instances.pasarela.minimum-number-of-calls=4
# los reintentos programados se disparan a mano en los tests
ventas.reintentos.habilitado=false
