# Base en memoria para los tests (no toca la base de archivo)
spring.datasource.url=jdbc:h2:mem:ventas_test;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
ventas.reserva-minutos=10
ventas.max-entradas-por-evento=4
# los tests no necesitan RabbitMQ: los eventos se verifican dentro de la aplicacion
ticketya.mensajeria.habilitada=false
