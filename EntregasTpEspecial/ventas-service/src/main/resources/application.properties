spring.application.name=ventas-service
server.port=8082

# Base de datos H2 en archivo (una por servicio) para ejecucion local. En Docker se reemplaza por
# PostgreSQL con las variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:h2:file:./data/ventas;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Configuracion del negocio
ventas.catalogo-url=http://localhost:8081
ventas.reserva-minutos=10
ventas.max-entradas-por-evento=4

management.endpoints.web.exposure.include=health
