spring.application.name=ventas-service
server.port=8082

# Base de datos H2 en archivo (una por servicio) para ejecucion local. En Docker se reemplaza por
# PostgreSQL con las variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:h2:file:./data/ventas;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Configuracion del negocio
ventas.catalogo-url=http://localhost:8081
ventas.reserva-minutos=10
ventas.max-entradas-por-evento=4

management.endpoints.web.exposure.include=health

# RabbitMQ: en Docker el host se define con SPRING_RABBITMQ_HOST=rabbitmq.
# Para ejecucion local: docker compose up rabbitmq mongo (los publica en localhost).
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=ticketya
spring.rabbitmq.password=ticketya
# Si se pone en false no se publican eventos (se usa en los tests)
ticketya.mensajeria.habilitada=true

# Fila virtual: secreto con el que fila-service firma los turnos (el mismo en los dos servicios). En Docker: TURNO_SECRET
ticketya.turno.secreto=${TURNO_SECRET:ticketya-secreto-de-turnos-fila-virtual-desarrollo-2026}

# ---------------- Resiliencia (Resilience4j) ----------------
# Catalogo: 3 intentos (200 ms, 400 ms) solo ante fallas de conexion o errores 5xx (no ante un 404).
resilience4j.retry.instances.catalogo.max-attempts=3
resilience4j.retry.instances.catalogo.wait-duration=200ms
resilience4j.retry.instances.catalogo.enable-exponential-backoff=true
resilience4j.retry.instances.catalogo.exponential-backoff-multiplier=2
resilience4j.retry.instances.catalogo.retry-exceptions=com.ticketya.ventas.exception.ServicioNoDisponibleException
# Circuit breaker: si falla la mitad de las ultimas 20 llamadas (minimo 10), se "abre" 15 s: durante ese tiempo
# las reservas fallan al instante (503) en lugar de esperar timeouts, y catalogo tiene tiempo de recuperarse.
resilience4j.circuitbreaker.instances.catalogo.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.catalogo.sliding-window-size=20
resilience4j.circuitbreaker.instances.catalogo.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.catalogo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogo.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.catalogo.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalogo.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.catalogo.record-exceptions=com.ticketya.ventas.exception.ServicioNoDisponibleException

# Pasarela de pagos: mismos criterios. Reintentar un cobro es seguro porque la pasarela recibe una referencia
# unica por compra (idempotencia): si el primer intento si llego a cobrar, el reintento no cobra dos veces.
resilience4j.retry.instances.pasarela.max-attempts=3
resilience4j.retry.instances.pasarela.wait-duration=300ms
resilience4j.retry.instances.pasarela.enable-exponential-backoff=true
resilience4j.retry.instances.pasarela.exponential-backoff-multiplier=2
resilience4j.retry.instances.pasarela.retry-exceptions=com.ticketya.ventas.client.PasarelaNoDisponibleException
resilience4j.circuitbreaker.instances.pasarela.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.pasarela.sliding-window-size=20
resilience4j.circuitbreaker.instances.pasarela.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.pasarela.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pasarela.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.pasarela.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.pasarela.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.pasarela.record-exceptions=com.ticketya.ventas.client.PasarelaNoDisponibleException

# Reintento programado de reintegros que la pasarela no acepto en su momento (devoluciones aprobadas)
ventas.reintentos.habilitado=true
ventas.reintentos.intervalo-ms=60000
