server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ---- auth-service (8083): registro, login y alta de usuarios ----
            - id: auth
              uri: ${AUTH_URL:http://localhost:8083}
              predicates:
                - Path=/auth/**

            # ---- catalogo-service (8081): lugares, eventos y busqueda ----
            - id: catalogo
              uri: ${CATALOGO_URL:http://localhost:8081}
              predicates:
                - Path=/lugares/**,/eventos/**

            # ---- ventas-service (8082): reservas, pagos, entradas, devoluciones, disponibilidad y control de acceso ----
            - id: ventas
              uri: ${VENTAS_URL:http://localhost:8082}
              predicates:
                - Path=/reservas/**,/entradas/**,/devoluciones/**,/disponibilidad/**,/accesos/**

            # ---- preferencias-service (8084): preferencias y recomendaciones (MongoDB) ----
            - id: preferencias
              uri: ${PREFERENCIAS_URL:http://localhost:8084}
              predicates:
                - Path=/preferencias/**,/recomendaciones/**

            # ---- notificaciones-service (8085): avisos recibidos por el usuario ----
            - id: notificaciones
              uri: ${NOTIFICACIONES_URL:http://localhost:8085}
              predicates:
                - Path=/notificaciones/**

            # ---- fila-service (8086): fila virtual para eventos de alta demanda (Redis) ----
            - id: fila
              uri: ${FILA_URL:http://localhost:8086}
              predicates:
                - Path=/filas/**

# IMPORTANTE: las rutas /interno/** (comunicacion entre servicios) NO se publican aqui,
# por eso no son accesibles desde afuera: el gateway responde 404.
# Las direcciones de los servicios se pueden cambiar con variables de entorno (en Docker apuntan a
# los nombres de los contenedores, por ejemplo http://catalogo-service:8081).

# Mismo secreto que auth-service (minimo 32 caracteres). En Docker se define con JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:ticketya-secreto-de-desarrollo-cambiar-en-produccion-2026}

management:
  endpoints:
    web:
      exposure:
        include: health
