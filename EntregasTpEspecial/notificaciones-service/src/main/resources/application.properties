spring.application.name=notificaciones-service
server.port=8085

# MongoDB (configuracion de la catedra). Base propia: "notificaciones" (misma instancia, esquema separado).
spring.data.mongodb.uri=mongodb://root:password@localhost:27017/notificaciones?authSource=admin
spring.data.mongodb.auto-index-creation=true

# RabbitMQ: en Docker el host se define con SPRING_RABBITMQ_HOST=rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=ticketya
spring.rabbitmq.password=ticketya
# Si procesar un mensaje falla: 3 intentos (1s, 2s) y despues va a la cola "ticketya.fallidos"
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Servicios que se consultan para armar los mensajes
notificaciones.catalogo-url=http://localhost:8081
notificaciones.preferencias-url=http://localhost:8084

management.endpoints.web.exposure.include=health
