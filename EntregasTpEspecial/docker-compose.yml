# TicketYa - sistema completo con un solo comando:   docker compose up --build
#
# Un contenedor por microservicio y por base de datos:
#  - PostgreSQL (una base por servicio) para auth, catalogo y ventas, que necesitan transacciones.
#  - MongoDB (configuracion de la catedra) para preferencias y notificaciones, cada uno con su propia base.
#  - RabbitMQ para la comunicacion asincronica (eventos de compras, cancelaciones y publicaciones).
#  - Redis para la fila virtual (fila-service) y la cache del catalogo.
#  - Log centralizado: Promtail junta los logs de todos los servicios, Loki los guarda y Grafana los muestra
#    (http://localhost:3000, tablero "TicketYa - Log centralizado").
# Solo el gateway (8080) y la interfaz grafica (3001, que le habla al gateway) publican un puerto hacia afuera:
# los servicios quedan en la red interna de Docker, asi nadie puede saltearse la validacion del JWT.
# Los servicios Java usan la hora de Argentina (TZ): las fechas sin zona de la API coinciden con las del navegador.
# MongoDB, RabbitMQ y Redis se publican solo en 127.0.0.1 (no en la red) para usar herramientas de desarrollo
# (MongoDB Compass, la consola web de RabbitMQ) y para correr los servicios desde IntelliJ.

x-postgres-healthcheck: &pg-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 3s
  retries: 20

services:

  # ------------------------------------------------------------------ bases de datos
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: ticketya
      POSTGRES_PASSWORD: ticketya
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  catalogo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: ticketya
      POSTGRES_PASSWORD: ticketya
    volumes:
      - catalogo-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  ventas-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ventas
      POSTGRES_USER: ticketya
      POSTGRES_PASSWORD: ticketya
    volumes:
      - ventas-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  # Configuracion de MongoDB provista por la catedra (mongodb.yml), con volumen y healthcheck agregados
  mongo:
    image: mongo:7.0.11
    command:
      - --auth
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: db
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------ mensajeria
  # Consola web: http://localhost:15672 (usuario ticketya / clave ticketya)
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ticketya
      RABBITMQ_DEFAULT_PASS: ticketya
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis: la fila virtual (fila-service) y la cache del catalogo (claves con prefijo "catalogo:").
  # Datos efimeros en memoria (sorted set + claves con TTL); no necesita persistencia.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------ microservicios
  auth-service:
    build: ./auth-service
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth
      SPRING_DATASOURCE_USERNAME: ticketya
      SPRING_DATASOURCE_PASSWORD: ticketya
      SPRING_H2_CONSOLE_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:-ticketya-secreto-de-desarrollo-cambiar-en-produccion-2026}
    depends_on:
      auth-db:
        condition: service_healthy

  catalogo-service:
    build: ./catalogo-service
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalogo-db:5432/catalogo
      SPRING_DATASOURCE_USERNAME: ticketya
      SPRING_DATASOURCE_PASSWORD: ticketya
      SPRING_H2_CONSOLE_ENABLED: "false"
      VENTAS_URL: http://ventas-service:8082
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      catalogo-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  ventas-service:
    build: ./ventas-service
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_DATASOURCE_URL: jdbc:postgresql://ventas-db:5432/ventas
      SPRING_DATASOURCE_USERNAME: ticketya
      SPRING_DATASOURCE_PASSWORD: ticketya
      SPRING_H2_CONSOLE_ENABLED: "false"
      # ventas.catalogo-url (Spring: puntos -> "_", sin guiones, en mayusculas)
      VENTAS_CATALOGOURL: http://catalogo-service:8081
      SPRING_RABBITMQ_HOST: rabbitmq
      TURNO_SECRET: ${TURNO_SECRET:-ticketya-secreto-de-turnos-fila-virtual-desarrollo-2026}
    depends_on:
      ventas-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  preferencias-service:
    build: ./preferencias-service
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_DATA_MONGODB_URI: mongodb://root:password@mongo:27017/preferencias?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
      PREFERENCIAS_CATALOGOURL: http://catalogo-service:8081
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  fila-service:
    build: ./fila-service
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_DATA_REDIS_HOST: redis
      FILA_CATALOGOURL: http://catalogo-service:8081
      TURNO_SECRET: ${TURNO_SECRET:-ticketya-secreto-de-turnos-fila-virtual-desarrollo-2026}
    depends_on:
      redis:
        condition: service_healthy

  notificaciones-service:
    build: ./notificaciones-service
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_DATA_MONGODB_URI: mongodb://root:password@mongo:27017/notificaciones?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
      NOTIFICACIONES_CATALOGOURL: http://catalogo-service:8081
      NOTIFICACIONES_PREFERENCIASURL: http://preferencias-service:8084
      NOTIFICACIONES_VENTASURL: http://ventas-service:8082
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ------------------------------------------------------------------ punto de entrada unico
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      TZ: America/Argentina/Buenos_Aires
      AUTH_URL: http://auth-service:8083
      CATALOGO_URL: http://catalogo-service:8081
      VENTAS_URL: http://ventas-service:8082
      PREFERENCIAS_URL: http://preferencias-service:8084
      NOTIFICACIONES_URL: http://notificaciones-service:8085
      FILA_URL: http://fila-service:8086
      JWT_SECRET: ${JWT_SECRET:-ticketya-secreto-de-desarrollo-cambiar-en-produccion-2026}
    depends_on:
      - auth-service
      - catalogo-service
      - ventas-service
      - preferencias-service
      - notificaciones-service
      - fila-service

  # ------------------------------------------------------------------ interfaz grafica (React)
  # nginx sirve la aplicacion compilada y reenvia /api/* al gateway: http://localhost:3001
  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - api-gateway

  # ------------------------------------------------------------------ log centralizado
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observabilidad/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ticketya-logs.json
    volumes:
      - ./observabilidad/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observabilidad/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observabilidad/grafana/ticketya-logs.json:/var/lib/grafana/dashboards/ticketya-logs.json:ro
    depends_on:
      - loki

volumes:
  auth-data:
  catalogo-data:
  ventas-data:
  mongo-data:
