spring.application.name=fila-service
server.port=8086

# Redis. Para ejecucion local: docker compose up -d redis. En Docker: SPRING_DATA_REDIS_HOST=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Fila virtual (version simplificada): cada "intervalo" se habilita una tanda de clientes, en orden de llegada.
# Cada cliente habilitado tiene "minutos-turno" para reservar.
fila.tamanio-tanda=50
fila.intervalo-ms=5000
fila.minutos-turno=10
fila.planificador.habilitado=true
fila.catalogo-url=http://localhost:8081

# Secreto con el que se firman los turnos (el mismo lo usa ventas para verificarlos). En Docker: TURNO_SECRET
ticketya.turno.secreto=${TURNO_SECRET:ticketya-secreto-de-turnos-fila-virtual-desarrollo-2026}

management.endpoints.web.exposure.include=health
