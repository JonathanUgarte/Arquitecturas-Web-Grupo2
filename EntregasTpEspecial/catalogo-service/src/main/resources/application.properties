spring.application.name=catalogo-service
server.port=8081

# Base de datos H2 en archivo (una por servicio) para ejecucion local. En Docker se reemplaza por
# PostgreSQL con las variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:h2:file:./data/catalogo;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Direccion del servicio de ventas (se usa al cancelar un evento)
ventas.url=http://localhost:8082

management.endpoints.web.exposure.include=health

# RabbitMQ: en Docker el host se define con SPRING_RABBITMQ_HOST=rabbitmq.
# Para ejecucion local: docker compose up rabbitmq mongo (los publica en localhost).
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=ticketya
spring.rabbitmq.password=ticketya
# Si se pone en false no se publican eventos (se usa en los tests)
ticketya.mensajeria.habilitada=true

# ---------------- Resiliencia (Resilience4j) hacia ventas ----------------
resilience4j.retry.instances.ventas.max-attempts=3
resilience4j.retry.instances.ventas.wait-duration=300ms
resilience4j.retry.instances.ventas.enable-exponential-backoff=true
resilience4j.retry.instances.ventas.exponential-backoff-multiplier=2
resilience4j.retry.instances.ventas.retry-exceptions=com.ticketya.catalogo.exception.ServicioNoDisponibleException
resilience4j.circuitbreaker.instances.ventas.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ventas.sliding-window-size=20
resilience4j.circuitbreaker.instances.ventas.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.ventas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ventas.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.ventas.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.ventas.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.ventas.record-exceptions=com.ticketya.catalogo.exception.ServicioNoDisponibleException

# Reintento programado de los avisos de cancelacion que ventas no recibio
catalogo.reintentos.habilitado=true
catalogo.reintentos.intervalo-ms=30000

# ---------------- Cache (Redis) ----------------
# En Docker: SPRING_DATA_REDIS_HOST=redis. Para ejecucion local: docker compose up -d redis.
# Si Redis no esta disponible, el catalogo funciona igual (lee de la base): ver CacheConfig.
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
