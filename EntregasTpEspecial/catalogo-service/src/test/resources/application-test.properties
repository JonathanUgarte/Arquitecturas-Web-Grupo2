# Base en memoria para los tests (no toca la base de archivo)
spring.datasource.url=jdbc:h2:mem:catalogo_test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
# el servicio de ventas se simula en los tests
ventas.url=http://localhost:9
# los tests no necesitan RabbitMQ: los eventos se verifican dentro de la aplicacion
ticketya.mensajeria.habilitada=false
# sin cache en los tests (CacheTest la activa en memoria); reintentos rapidos y circuito chico
spring.cache.type=none
resilience4j.retry.instances.ventas.wait-duration=10ms
resilience4j.circuitbreaker.instances.ventas.sliding-window-size=4
resilience4j.circuitbreaker.instances.ventas.minimum-number-of-calls=4
catalogo.reintentos.habilitado=false
